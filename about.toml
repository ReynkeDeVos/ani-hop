# cargo-about: `cargo about generate --frozen --fail about.hbs -o THIRD-PARTY-LICENSES.md`
targets = ["x86_64-unknown-linux-musl", "aarch64-unknown-linux-musl", "aarch64-apple-darwin"]
ignore-build-dependencies = true
ignore-dev-dependencies = true
accepted = [
    "GPL-3.0-or-later", # ani-hop itself, left out by about.hbs
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-3-Clause",
    "BSL-1.0",
    "CDLA-Permissive-2.0",
    "ISC",
    "MPL-2.0",
    "Unicode-3.0",
    "Unlicense",
    "Zlib",
]
