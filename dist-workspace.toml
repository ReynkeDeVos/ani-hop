[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.33.0"
# CI backends to support
ci = "github"
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-musl", "x86_64-unknown-linux-musl"]
# The installers to generate for each app
installers = ["homebrew"]
# A GitHub repo to push Homebrew formulas to
tap = "ReynkeDeVos/homebrew-tap"
# Publish jobs to run in CI
publish-jobs = ["homebrew", "./publish-aur"]
# The notes say what changed; how to install is the README's (dist adds an Install section)
post-announce-jobs = ["./release-notes"]
# Build every target on pull requests too, without publishing
pr-run-mode = "upload"
# Shipped in every archive next to the binary
include = ["THIRD-PARTY-LICENSES.md"]

# dist's default runners (ubuntu-22.04, macos-14) are being retired
[dist.github-custom-runners]
global = "ubuntu-24.04"
x86_64-unknown-linux-musl = "ubuntu-24.04"
aarch64-unknown-linux-musl = "ubuntu-24.04-arm"
aarch64-apple-darwin = "macos-15"

# Homebrew's mpv already pulls in ffmpeg; ani-cli comes from its own tap
[dist.dependencies.homebrew]
mpv = { stage = ["run"] }
yt-dlp = { stage = ["run"] }
