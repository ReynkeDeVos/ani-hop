# Takes dist's "Install" section out of a GitHub release's notes, which say what changed:
# the README says how to install. release.yml (generated by dist) calls this after the
# announce; run it by hand to clean an earlier release.
# shortcut: GitHub skips it on a prerelease, as dist's publish jobs skip themselves there and
# dist 0.33 can't give this job an always(); ani-hop has made none, so run it by hand if it does.
name: Release notes without install steps

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.7.0
        required: true

jobs:
  notes:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      PLAN: ${{ inputs.plan }}
      TAG: ${{ inputs.tag }}
    steps:
      - name: Drop the Install section
        run: |
          tag=${TAG:-$(jq -r .announcement_tag <<< "$PLAN")}
          gh release view "$tag" --repo "$GITHUB_REPOSITORY" --json body -q .body > notes.md
          # from "## Install ani-hop X.Y.Z" up to the next "## " heading ("## Download …")
          awk '/^## Install /{skip=1; next} /^## /{skip=0} !skip' notes.md > clean.md
          if cmp -s notes.md clean.md; then
            echo "No Install section in the notes of $tag"
          else
            gh release edit "$tag" --repo "$GITHUB_REPOSITORY" --notes-file clean.md
          fi
