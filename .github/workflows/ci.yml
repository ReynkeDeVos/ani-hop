name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked

  # The release archives ship THIRD-PARTY-LICENSES.md, so it has to match Cargo.lock.
  licences:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Install cargo-about
        run: |
          curl -fsSL https://github.com/EmbarkStudios/cargo-about/releases/download/0.9.2/cargo-about-0.9.2-x86_64-unknown-linux-musl.tar.gz \
            | tar xz --strip-components=1 -C ~/.cargo/bin cargo-about-0.9.2-x86_64-unknown-linux-musl/cargo-about
      - run: cargo fetch --locked
      - run: cargo about generate --frozen --fail about.hbs -o THIRD-PARTY-LICENSES.md
      - name: Check it's up to date
        run: git diff --exit-code THIRD-PARTY-LICENSES.md || { echo "Run the command from about.toml and commit THIRD-PARTY-LICENSES.md"; exit 1; }

  # The flake (Linux only) builds ani-hop and runs its tests in Nix's sandbox, against
  # nixpkgs' tools.
  nix:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: cachix/install-nix-action@v31
      - run: nix build -L
      - run: ./result/bin/ani-hop --version
