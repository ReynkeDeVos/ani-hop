# Pushes ani-hop-bin to the AUR. release.yml (generated by dist) calls this once the
# GitHub release and its archives exist; run it by hand to publish a release again.
# Without the secret AUR_SSH_PRIVATE_KEY it only checks the archives.
name: Publish to the AUR

on:
  workflow_call:
    inputs:
      plan:
        required: true
        type: string
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, e.g. v0.6.0
        required: true

jobs:
  aur:
    runs-on: ubuntu-24.04
    env:
      PLAN: ${{ inputs.plan }}
      TAG: ${{ inputs.tag }}
      HAS_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY != '' }}
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - name: Fill in version and checksums
        id: pkg
        shell: bash # with pipefail, so a failed download stops here
        run: |
          tag=${TAG:-$(jq -r .announcement_tag <<< "$PLAN")}
          base="https://github.com/ReynkeDeVos/ani-hop/releases/download/$tag"
          sum() { curl -fsSL "$base/ani-hop-$1-unknown-linux-musl.tar.xz.sha256" | cut -d' ' -f1; }
          x86_64=$(sum x86_64)
          aarch64=$(sum aarch64)
          [[ $x86_64 =~ ^[0-9a-f]{64}$ && $aarch64 =~ ^[0-9a-f]{64}$ ]]
          cp -r .github/aur aur
          sed -i -e "s/@VERSION@/${tag#v}/" -e "s/@SHA256_X86_64@/$x86_64/" \
            -e "s/@SHA256_AARCH64@/$aarch64/" aur/PKGBUILD
          echo "version=${tag#v}" >> "$GITHUB_OUTPUT"
      # pinned by commit: this action gets the AUR key
      - uses: KSXGitHub/github-actions-deploy-aur@084b0d9b15415bf9cdb65d44dad1efe37a354050 # v4.2.0
        if: env.HAS_KEY == 'true'
        with:
          pkgname: ani-hop-bin
          asset_dir: aur
          commit_username: github-actions[bot]
          commit_email: 41898282+github-actions[bot]@users.noreply.github.com
          ssh_private_key: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
          commit_message: ani-hop ${{ steps.pkg.outputs.version }}
